# The ceiling of every machine check: how many violations the code has now (docs/sennard60-architecture-checks.md).
# A check fails above its ceiling (a new violation) and below it (lower the number here). Only a person lowers a ceiling; the 6.0.0 rewrite brings each one to 0.
# Rule k (a reference column without a foreign key) is in sennard-store-pg, ForeignKeyCatalogTest.CEILING, because it reads the catalog of a real PostgreSQL.
# Measured at 9d71c662 plus the checks (2026-11-11); f-swallowed-catch, l-sql-udf-call, m-pg-syntax and m-rls lowered after the board's rewrite (BoardStore and its row-level security are gone);
# c-value-annotation, l-sql-udf-call, m-pg-syntax and m-rls lowered after the messaging's rewrite (MessagingStore and its row-level security are gone).
a-package-cycles-direct=0
# b, c-getenv, c-getproperty, g-string-switch, g-string-equals and i-path-string count the product's business code only: the boundaries on Boundaries.LIST are not counted
# (host hook input conversion, installer, settings binding, build tool). Measured at bd783f61: 17, 4, 1, 20, 248 and 74 before the list, these after it.
# Integration of the seven hand-roll removal branches (core, web, state, skills, personal, workflow, and the hooks branch) (2026-11-11): the values below are the counts measured on the merged result, each below the lowest of the branches.
b-os-branching=0
c-value-annotation=0
c-getenv=0
c-getproperty=0
c-getproperty-jvm=0
d-stateful-static=0
e-console-output=0
e-print-stack-trace=0
f-swallowed-catch=0
g-string-switch=0
g-string-equals=0
h-managed-version=0
h-boot-version-copy=1
i-path-string=0
j-sql-trigger=0
# The functions and the DO block of V2 went with the roles and the row-level security: a plain ban now.
l-sql-logic-object=0
l-sql-udf-call=0
# The code's SQL is ANSI (a plain ban, A2): no ON CONFLICT, RETURNING, :: cast, json or jsonb, partial index, IF EXISTS in DDL, current_setting.
m-pg-syntax=0
# Removal targets, counted apart from m-pg-syntax: row level security and advisory locks have no standard SQL form.
# Row level security and advisory locks have no standard SQL form: a plain ban.
m-rls=0
m-advisory-lock=0
# One user on one PC (a plain ban): no account, tenant or namespace column or table (account*, ns, tenant*, namespace*) in the migrations or the SQL strings of the code, and no such field in a @Table entity or such name in a repository's derived query.
n-no-multi-user-columns=0
# The verbs the database's grants allowed per table (SELECT only, SELECT and INSERT, ...) are held by the code: user_prompt and transcript_anchor are written by one class and never updated or deleted, the glossary is written by the migrations only.
w-sql-write-verb=0
sql-limit-only-builder=0
# A host's name is written in the one file that defines the host (HostRules): a plain ban.
q-host-name-literal=0
# A failure's reason is a constant of a code enum, not a string: none in sennard-server, sennard-personal's own failures, sennard-app, sennard-domain, sennard-protocol and sennard-repo-tools.
# What remains is the types of the modules this rule does not cover: the store's exception has a StoreCode constant now, so it is gone from the count, and the session registry
# states its refusals as SennardExceptions with codes of the code enums (ServiceFailure is gone), and one envelope record that the rule takes for a failure by its name (sennard-server
# UndeclaredArgumentGuard's Failure, a wire record). A switch that answers the seven categories has no default, at the HTTP and the MCP boundary (a plain ban).
s-string-code-exception=0
t-sennardexception-switch-default=0
# sennard-domain is plain Java: no org.springframework, java.sql, javax.sql or tools.jackson.databind in its sources (a plain ban).
o-domain-imports=0
# Optional is for a method's return type ("no result"): none as a field, a record component, a parameter or a collection's element, and no orElse(null).
# Every module is at 0, sennard-core's two record components (CallAdmissions.PrefixClaim, SessionRegistry.RefIdentity) included.
p-optional-not-return=0
p-or-else-null=0
# The user's three exceptions to "Sennard is Java only", checked over the whole repository (RepositoryRules):
# a script executable is only java/gradlew and java/gradlew.bat (a plain ban);
script-executables=0
# a plugin package defines no hook and no MCP server: the hook definitions (hooks.json, hooks/hooks.json, claude-plugin/hooks/hooks.json, claude-overlay/hooks/hooks.json, gemini-extension/hooks/hooks.json) have no handler and the MCP files (.mcp.json, mcp_config.json,
# the Claude plugin's .mcp.json and manifest, gemini-extension.json) have no server, because the program and the address file they would name are the installation's (the server's port is the operating system's choice at each start); the places a command may be are HookCommandPlacesTest's;
hook-command-not-java-client=0
# a CI step's run calls only ./gradlew in a job without write permission (tar, curl, sed, sha256sum, pwsh and the like move into Gradle and JUnit); a job with write permission
# checks out nothing, runs no ./gradlew and no script of the repository, uses no action but actions/download-artifact and runs only gh release upload.
ci-run-not-gradlew=0
# A transaction is a service method's @Transactional and nothing else (TransactionBoundaryRules, held by TransactionBoundaryRulesTest): no PlatformTransactionManager.getTransaction, commit or rollback,
# no java.sql.Connection setAutoCommit, commit, rollback or setSavepoint (except the three classes named with a reason in TransactionBoundaryRules.Names.PRODUCT), and no noRollbackFor,
# noRollbackForClassName or dontRollbackOn on @Transactional (a refusal rolls the whole use case back). At m5 the two noRollbackFor of WorkflowService are the only finds, and are being removed.
u-tx-platform-manager=0
u-tx-jdbc-connection=0
u-tx-no-rollback-for=0
