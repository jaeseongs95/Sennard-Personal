version=1.0.0
# This file states no memory, worker or daemon setting: the sizes of the build are Gradle's own (https://docs.gradle.org/current/userguide/build_environment.html).
# A computer that wants others states them in its own ~/.gradle/gradle.properties or on the command line: org.gradle.jvmargs, org.gradle.workers.max,
# org.gradle.daemon.idletimeout, and for the tests -Psennard.test.heap, -Psennard.test.cpus and -Psennard.test.childHeap (java/build.gradle.kts, which also describes the opt-in heap ledger).
# (CI runs `./gradlew --no-daemon`: a CI runner is used once, so a daemon would only hold memory there.)
# Tasks of different modules run at the same time, the test tasks included: each test JVM keeps its servers, ports and folders to itself. The one shared resource,
# the business database the tests tagged business-db name (businessDbTest), is used by one test task at a time (sharedBusinessDb in build.gradle.kts).
org.gradle.parallel=true
# The local build cache (https://docs.gradle.org/current/userguide/build_cache.html): the output of compilation, resources and jars is taken from it in a fresh working
# copy of the same commit. A Test task is never taken from it (java/build.gradle.kts, doNotCacheIf): a test run is run, not replayed.
org.gradle.caching=true
# The configuration cache (https://docs.gradle.org/current/userguide/configuration_cache.html): the build's configuration is kept for the next build with the same tasks and
# inputs. The packaging tasks of sennard-personal hold local values and an injected FileSystemOperations in their actions so that it can store them.
org.gradle.configuration-cache=true
