name: CI

on:
  # Manual runs only: CI runs when a change needs remote verification, after the full local pass.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JDK 25 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast is left at its default: a failed OS job cancels the jobs still running.
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      # The whole JUnit suite of the test tasks, including the repository's contract checks and real server processes.
      # Measurements against real hosts and models are not CI's: they run on the test servers. The tests of the business schema (tag business-db)
      # are not in `test`: they are the task businessDbTest, which needs a PostgreSQL database named by -Psennard.test.businessDb.url, .user and .passwordFile (CONTRIBUTING.md)
      # and fails when asked for without them. This job has no such database and does not request the task.
      # No --continue: after a failed task Gradle starts no further task. --fail-fast stops a test task at its first failed test. Test tasks
      # of other modules already running in parallel still run to their end.
      - name: Test
        shell: bash
        working-directory: java
        run: ./gradlew --no-daemon --console=plain test --fail-fast
      # The lines the change adds, as `git diff --check` reads them (JGit, no git program): a pull request's base...HEAD, else the commit at HEAD against its parent. The base is
      # empty outside a pull request, and an empty base is none.
      - name: Check whitespace of the added lines
        shell: bash
        working-directory: java
        run: ./gradlew --no-daemon --console=plain :sennard-repo-tools:checkWhitespace -Ptool="--base ${{ github.event.pull_request.base.sha }}"
