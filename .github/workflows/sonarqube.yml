name: SonarQube

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    if: github.repository == 'jaeseongs95/Sennard-Personal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Test and generate JaCoCo XML reports
        working-directory: java
        run: ./gradlew --no-daemon --console=plain test jacocoTestReport
      - name: Run SonarQube analysis and wait for the quality gate
        working-directory: java
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./gradlew --no-daemon --console=plain sonar
          -Dsonar.projectKey=sennard-source
          -Dsonar.verbose=false
          -Dsonar.log.level=INFO
          -Dorg.gradle.logging.level=lifecycle
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
